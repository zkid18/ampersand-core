[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ampersand-core"
version = "0.2.0"
description = "Ampersand engine — extraction, storage, search, and the HTTP server."
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "httpx>=0.27",
    "trafilatura>=1.8",
    "yt-dlp>=2024.1",
    "markdownify>=0.13",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
    "feedparser>=6.0",
    "playwright>=1.40",
    "python-ulid>=2.0",
    "youtube-transcript-api>=1.0",
    "html-to-markdown>=3.0",
    "sqlite-vec>=0.1.6",
    "openai>=1.50",
    "tiktoken>=0.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "typer>=0.9",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "watchdog>=4.0",
]

[project.optional-dependencies]
linkedin = ["faster-whisper>=1.0"]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "faster-whisper>=1.0",
]

[project.scripts]
ampersand-admin = "ampersand_core.server.admin_cli.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ampersand_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
