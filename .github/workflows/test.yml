name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
      # Keep the matrix going if one Python version blips — the other two
      # still tell us whether the change is broadly broken.
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Install with dev extras so pytest + httpx + faster-whisper are
          # all available. faster-whisper is heavy but it's already in the
          # pip cache from a previous run after the first build, so the
          # full install lands under a minute on subsequent runs.
          pip install -e ".[dev]"

      - name: Run pytest
        env:
          # Tests never hit the network or talk to a real LLM, so these are
          # placeholders that satisfy the env-var probes.
          AMPERSTAND_API_KEY: ci-devkey
        run: |
          pytest -q --tb=short
